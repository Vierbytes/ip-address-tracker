<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- displays site properly based on user's device -->
		<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png"/>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
		<title>IP Address Tracker</title>

		<!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
		<!-- <style>.attribution {font-size: 11px; text-align: center;} .attribution a {color: hsl(228, 45%, 44%);}</style> -->
	</head>
	<body>

    <!-- Header Section -->
    <header class="header">
      <div class="header-content">
        <h1 class="title">
          IP Address Tracker
        </h1>
    <!-- Form Section -->
        <form action="" class="search-form" id="searchForm">
          <input type="text" class="search-input" id="searchInput" placeholder="Search for any IP address or domain" aria-label="Search for any IP address or domain">
          <button type="submit" class="search-button" aria-label="Search">
            <img src="images/icon-arrow.svg" alt="Search arrow">
          </button>
        </form>
      </div>
    </header>

    <!-- Info Panel -->
    <div class="info-container">
      <div class="info-grid">
        <!-- Ip Address -->
        <div class="info-item">
          <h2 class="info-label">IP Address</h2>
          <p class="info-value" id="ipAddress"></p>
        </div>
        <!-- Location -->
        <div class="info-item">
          <h2 class="info-label">Location</h2>
          <p class="info-value" id="location"></p>
        </div>
        <!-- Timezone -->
        <div class="info-item">
          <h2 class="info-label">Timezone</h2>
          <p class="info-value" id="timezone"></p>
        </div>
        <!-- Internet Service Provider -->
        <div class="info-item">
          <h2 class="info-label">ISP</h2>
          <p class="info-value" id="isp"></p>
        </div>
      </div>
    </div>

	</body>
</html>
